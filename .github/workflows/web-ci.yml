name: Vision-IA Web QA

on:
  push:
    paths:
      - "index.html"
      - "sw.js"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "sw.js"
      - ".github/workflows/web-ci.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
          inline = [s for s in scripts if s.strip()]
          assert inline, "No inline scripts found"
          Path("/tmp/vision-ia-inline.js").write_text("\n;\n".join(inline), encoding="utf-8")
          PY

      - name: JavaScript syntax
        run: node --check /tmp/vision-ia-inline.js

      - name: Mistral throttle regression guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")

          assert "vai_cadence_v5" in html
          assert "pi.cadence = Math.max(0, p.cadence || 0);" in html
          assert "Math.min(18000, cible)" in html
          assert "depouillementOffset" in html
          assert "corrigerReservation(ticket, reel)" in html

          # Batch requests must carry the model in each body.
          assert "model: PROVIDERS.mistral.modele" in html
          assert "requests: requests" in html

          # Mistral-only configuration must use the free realtime path, not Batch.
          assert "function modeMistralGratuit()" in html
          assert "Mode Mistral gratuit" in html
          assert "e && e.code === 402" in html
          assert "poursuite en Mistral gratuit" in html

          # Free mode starts small and adapts on a 429.
          assert "if(modeMistralGratuit()) return 3000;" in html
          assert "function demanderMistralGratuit(" in html
          assert "MIN_TRANCHE_FREE = 900" in html
          assert "lots.slice(pos).join('')" in html
          assert "p.tailleTrancheMistral = nouvelleTaille" in html
          assert "ministral-3b-latest" in html
          assert "function detailErreurApi(" in html
          assert "Quota Mistral Free atteint sur Ministral 3B et Mistral Small" in html

          # Other Batch failures can still use configured non-Mistral fallbacks.
          assert "demanderDepouillementSansMistral" in html

          # Regression guard: old fixed 90-second retry arrays/messages are forbidden.
          assert "[60, 90, 90, 90, 90, 90]" not in html
          assert "reprise dans 90 s" not in html

          print("Mistral Free/Batch/throttle regression guards: OK")
          PY
