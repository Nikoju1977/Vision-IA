name: Vision-IA Web QA

on:
  push:
    paths:
      - "index.html"
      - "sw.js"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "index.html"
      - "sw.js"
      - ".github/workflows/web-ci.yml"

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.I | re.S)
          inline = [s for s in scripts if s.strip()]
          assert inline, "No inline scripts found"
          Path("/tmp/vision-ia-inline.js").write_text("\n;\n".join(inline), encoding="utf-8")
          PY

      - name: JavaScript syntax
        run: node --check /tmp/vision-ia-inline.js

      - name: Vision-IA regression guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")

          # Cadence, reprise et persistance.
          assert "vai_cadence_v6" in html
          assert "pi.cadence = Math.max(0, p.cadence || 0);" in html
          assert "depouillementOffset" in html
          assert "corrigerReservation(ticket, reel)" in html
          assert "function strategieDepouillement(" in html
          assert "if(strategie === 'groq' || strategie === 'secours') return 9000;" in html
          assert "Document long — Groq en priorité, avec repli Mistral automatique si nécessaire." in html
          assert "route === 'groq-premier'" in html
          assert "demanderMistralGratuit(messages, 0.4, 500, groqPremier)" in html
          assert "function demanderMistralGratuit(" in html
          assert "MIN_TRANCHE_FREE = 900" in html
          assert "p.tailleTrancheMistral = nouvelleTaille" in html
          assert "function demanderDepouillementSansMistral" in html

          # Modèles actuels et coffre à clés.
          assert "ministral-3b-latest" in html
          assert "openai/gpt-oss-20b" in html
          assert "Groq GPT-OSS 20B" in html
          assert "pixtral-12b-2409" not in html
          assert "safeStorage.getItem(VISION.cle)" not in html
          assert "trousseau.lire('mistral')" in html

          # Source de vérité et isolation du découpage.
          assert "DISCIPLINE DE SOURCE" in html
          assert "SOURCE UNIQUE DE LA SÉQUENCE" in html
          assert "planSource" in html
          assert "Source verrouillée" in html
          assert "if(p.genre !== 'scenario') continue;" in html

          # L'export imprimé ne doit plus capturer les toasts / écrans de travail.
          assert "#service,#ecriture,.vue" in html
          assert "#vue-dossier{display:block !important}" in html

          # Régressions historiques interdites.
          assert "[60, 90, 90, 90, 90, 90]" not in html
          assert "reprise dans 90 s" not in html

          print("Vision-IA regression guards: OK")
          PY
